# The catalog with the minimal example: every policy that's on by default renders a policy and
# its bindings (two for workloads, one otherwise). Field-level
# details are in policy_test, bindings_test, and the examples snapshot; the CEL itself is
# checked by the API server (make e2e).
suite: catalog
templates:
  - templates/validating.yaml
release:
  name: policy
values:
  - ../../../../examples/minimal.yaml
tests:
  - it: renders the policies on by default (15 workloads x 3, 1 services x 2, 1 rbac x 2)
    asserts:
      - hasDocuments: { count: 49 }

  - it: disallow-pod-exec is off by default
    asserts:
      - containsDocument: { kind: ValidatingAdmissionPolicy, apiVersion: admissionregistration.k8s.io/v1, name: disallow-pod-exec, any: true }
        not: true

  - it: disallow-pod-exec renders a policy and one binding when enabled
    set:
      policies:
        disallow-pod-exec: { enabled: true }
    asserts:
      - hasDocuments: { count: 51 }
      - containsDocument: { kind: ValidatingAdmissionPolicyBinding, apiVersion: admissionregistration.k8s.io/v1, name: disallow-pod-exec, any: true }

  - it: require-read-only-root-filesystem
    asserts:
      - containsDocument: { kind: ValidatingAdmissionPolicy, apiVersion: admissionregistration.k8s.io/v1, name: require-read-only-root-filesystem, any: true }
      - containsDocument: { kind: ValidatingAdmissionPolicyBinding, apiVersion: admissionregistration.k8s.io/v1, name: require-read-only-root-filesystem, any: true }
      - containsDocument: { kind: ValidatingAdmissionPolicyBinding, apiVersion: admissionregistration.k8s.io/v1, name: require-read-only-root-filesystem-controllers, any: true }

  - it: restrict-external-ips
    asserts:
      - containsDocument: { kind: ValidatingAdmissionPolicy, apiVersion: admissionregistration.k8s.io/v1, name: restrict-external-ips, any: true }
      - containsDocument: { kind: ValidatingAdmissionPolicyBinding, apiVersion: admissionregistration.k8s.io/v1, name: restrict-external-ips, any: true }

  - it: restrict-wildcard-rbac
    asserts:
      - containsDocument: { kind: ValidatingAdmissionPolicy, apiVersion: admissionregistration.k8s.io/v1, name: restrict-wildcard-rbac, any: true }
      - containsDocument: { kind: ValidatingAdmissionPolicyBinding, apiVersion: admissionregistration.k8s.io/v1, name: restrict-wildcard-rbac, any: true }

  - it: disallow-host-namespaces
    asserts:
      - containsDocument: { kind: ValidatingAdmissionPolicy, apiVersion: admissionregistration.k8s.io/v1, name: disallow-host-namespaces, any: true }
      - containsDocument: { kind: ValidatingAdmissionPolicyBinding, apiVersion: admissionregistration.k8s.io/v1, name: disallow-host-namespaces, any: true }
      - containsDocument: { kind: ValidatingAdmissionPolicyBinding, apiVersion: admissionregistration.k8s.io/v1, name: disallow-host-namespaces-controllers, any: true }

  - it: disallow-host-path
    asserts:
      - containsDocument: { kind: ValidatingAdmissionPolicy, apiVersion: admissionregistration.k8s.io/v1, name: disallow-host-path, any: true }
      - containsDocument: { kind: ValidatingAdmissionPolicyBinding, apiVersion: admissionregistration.k8s.io/v1, name: disallow-host-path, any: true }
      - containsDocument: { kind: ValidatingAdmissionPolicyBinding, apiVersion: admissionregistration.k8s.io/v1, name: disallow-host-path-controllers, any: true }

  - it: disallow-privileged-containers
    asserts:
      - containsDocument: { kind: ValidatingAdmissionPolicy, apiVersion: admissionregistration.k8s.io/v1, name: disallow-privileged-containers, any: true }
      - containsDocument: { kind: ValidatingAdmissionPolicyBinding, apiVersion: admissionregistration.k8s.io/v1, name: disallow-privileged-containers, any: true }
      - containsDocument: { kind: ValidatingAdmissionPolicyBinding, apiVersion: admissionregistration.k8s.io/v1, name: disallow-privileged-containers-controllers, any: true }

  - it: require-run-as-non-root
    asserts:
      - containsDocument: { kind: ValidatingAdmissionPolicy, apiVersion: admissionregistration.k8s.io/v1, name: require-run-as-non-root, any: true }
      - containsDocument: { kind: ValidatingAdmissionPolicyBinding, apiVersion: admissionregistration.k8s.io/v1, name: require-run-as-non-root, any: true }
      - containsDocument: { kind: ValidatingAdmissionPolicyBinding, apiVersion: admissionregistration.k8s.io/v1, name: require-run-as-non-root-controllers, any: true }

  - it: restrict-image-registries
    asserts:
      - containsDocument: { kind: ValidatingAdmissionPolicy, apiVersion: admissionregistration.k8s.io/v1, name: restrict-image-registries, any: true }
      - containsDocument: { kind: ValidatingAdmissionPolicyBinding, apiVersion: admissionregistration.k8s.io/v1, name: restrict-image-registries, any: true }
      - containsDocument: { kind: ValidatingAdmissionPolicyBinding, apiVersion: admissionregistration.k8s.io/v1, name: restrict-image-registries-controllers, any: true }

  - it: disallow-host-ports
    asserts:
      - containsDocument: { kind: ValidatingAdmissionPolicy, apiVersion: admissionregistration.k8s.io/v1, name: disallow-host-ports, any: true }
      - containsDocument: { kind: ValidatingAdmissionPolicyBinding, apiVersion: admissionregistration.k8s.io/v1, name: disallow-host-ports, any: true }
      - containsDocument: { kind: ValidatingAdmissionPolicyBinding, apiVersion: admissionregistration.k8s.io/v1, name: disallow-host-ports-controllers, any: true }

  - it: disallow-privilege-escalation
    asserts:
      - containsDocument: { kind: ValidatingAdmissionPolicy, apiVersion: admissionregistration.k8s.io/v1, name: disallow-privilege-escalation, any: true }
      - containsDocument: { kind: ValidatingAdmissionPolicyBinding, apiVersion: admissionregistration.k8s.io/v1, name: disallow-privilege-escalation, any: true }
      - containsDocument: { kind: ValidatingAdmissionPolicyBinding, apiVersion: admissionregistration.k8s.io/v1, name: disallow-privilege-escalation-controllers, any: true }

  - it: require-drop-all-capabilities
    asserts:
      - containsDocument: { kind: ValidatingAdmissionPolicy, apiVersion: admissionregistration.k8s.io/v1, name: require-drop-all-capabilities, any: true }
      - containsDocument: { kind: ValidatingAdmissionPolicyBinding, apiVersion: admissionregistration.k8s.io/v1, name: require-drop-all-capabilities, any: true }
      - containsDocument: { kind: ValidatingAdmissionPolicyBinding, apiVersion: admissionregistration.k8s.io/v1, name: require-drop-all-capabilities-controllers, any: true }

  - it: restrict-seccomp
    asserts:
      - containsDocument: { kind: ValidatingAdmissionPolicy, apiVersion: admissionregistration.k8s.io/v1, name: restrict-seccomp, any: true }
      - containsDocument: { kind: ValidatingAdmissionPolicyBinding, apiVersion: admissionregistration.k8s.io/v1, name: restrict-seccomp, any: true }
      - containsDocument: { kind: ValidatingAdmissionPolicyBinding, apiVersion: admissionregistration.k8s.io/v1, name: restrict-seccomp-controllers, any: true }

  - it: restrict-apparmor
    asserts:
      - containsDocument: { kind: ValidatingAdmissionPolicy, apiVersion: admissionregistration.k8s.io/v1, name: restrict-apparmor, any: true }
      - containsDocument: { kind: ValidatingAdmissionPolicyBinding, apiVersion: admissionregistration.k8s.io/v1, name: restrict-apparmor, any: true }
      - containsDocument: { kind: ValidatingAdmissionPolicyBinding, apiVersion: admissionregistration.k8s.io/v1, name: restrict-apparmor-controllers, any: true }

  - it: restrict-selinux
    asserts:
      - containsDocument: { kind: ValidatingAdmissionPolicy, apiVersion: admissionregistration.k8s.io/v1, name: restrict-selinux, any: true }
      - containsDocument: { kind: ValidatingAdmissionPolicyBinding, apiVersion: admissionregistration.k8s.io/v1, name: restrict-selinux, any: true }
      - containsDocument: { kind: ValidatingAdmissionPolicyBinding, apiVersion: admissionregistration.k8s.io/v1, name: restrict-selinux-controllers, any: true }

  - it: restrict-proc-mount
    asserts:
      - containsDocument: { kind: ValidatingAdmissionPolicy, apiVersion: admissionregistration.k8s.io/v1, name: restrict-proc-mount, any: true }
      - containsDocument: { kind: ValidatingAdmissionPolicyBinding, apiVersion: admissionregistration.k8s.io/v1, name: restrict-proc-mount, any: true }
      - containsDocument: { kind: ValidatingAdmissionPolicyBinding, apiVersion: admissionregistration.k8s.io/v1, name: restrict-proc-mount-controllers, any: true }

  - it: restrict-sysctls
    asserts:
      - containsDocument: { kind: ValidatingAdmissionPolicy, apiVersion: admissionregistration.k8s.io/v1, name: restrict-sysctls, any: true }
      - containsDocument: { kind: ValidatingAdmissionPolicyBinding, apiVersion: admissionregistration.k8s.io/v1, name: restrict-sysctls, any: true }
      - containsDocument: { kind: ValidatingAdmissionPolicyBinding, apiVersion: admissionregistration.k8s.io/v1, name: restrict-sysctls-controllers, any: true }

  - it: restrict-volume-types
    asserts:
      - containsDocument: { kind: ValidatingAdmissionPolicy, apiVersion: admissionregistration.k8s.io/v1, name: restrict-volume-types, any: true }
      - containsDocument: { kind: ValidatingAdmissionPolicyBinding, apiVersion: admissionregistration.k8s.io/v1, name: restrict-volume-types, any: true }
      - containsDocument: { kind: ValidatingAdmissionPolicyBinding, apiVersion: admissionregistration.k8s.io/v1, name: restrict-volume-types-controllers, any: true }

  - it: each policy's controls (PSS level, NIST) and validation count follow its definition
    asserts:
      - equal: { path: "metadata.annotations['policy.posture.dev/pss']", value: baseline }
        documentSelector: { path: "metadata.annotations['policy.posture.dev/description']", value: "Containers may not run privileged or as Windows HostProcess." }
      - equal: { path: "metadata.annotations['policy.posture.dev/nist']", value: "AC-6, CM-7" }
        documentSelector: { path: "metadata.annotations['policy.posture.dev/description']", value: "Containers may not run privileged or as Windows HostProcess." }
      - lengthEqual: { path: spec.validations, count: 2 }
        documentSelector: { path: "metadata.annotations['policy.posture.dev/description']", value: "Containers may not run privileged or as Windows HostProcess." }
      - equal: { path: "metadata.annotations['policy.posture.dev/pss']", value: baseline }
        documentSelector: { path: "metadata.annotations['policy.posture.dev/description']", value: "Pods may not share the node's network, process, or IPC namespaces." }
      - lengthEqual: { path: spec.validations, count: 3 }
        documentSelector: { path: "metadata.annotations['policy.posture.dev/description']", value: "Pods may not share the node's network, process, or IPC namespaces." }
      - equal: { path: "metadata.annotations['policy.posture.dev/nist']", value: "AC-6, SC-39" }
        documentSelector: { path: "metadata.annotations['policy.posture.dev/description']", value: "Pods may not mount directories from the node (hostPath volumes)." }
      - lengthEqual: { path: spec.validations, count: 1 }
        documentSelector: { path: "metadata.annotations['policy.posture.dev/description']", value: "Pods may not mount directories from the node (hostPath volumes)." }
      - equal: { path: "metadata.annotations['policy.posture.dev/pss']", value: restricted }
        documentSelector: { path: "metadata.annotations['policy.posture.dev/description']", value: "Every container runs as a non-root user." }
      - equal: { path: "metadata.annotations['policy.posture.dev/nist']", value: AC-6 }
        documentSelector: { path: "metadata.annotations['policy.posture.dev/description']", value: "Every container runs as a non-root user." }
      - lengthEqual: { path: spec.validations, count: 2 }
        documentSelector: { path: "metadata.annotations['policy.posture.dev/description']", value: "Every container runs as a non-root user." }

  - it: require-run-as-non-root keeps its own variable after the shared ones, before exempt
    documentSelector: { path: "metadata.annotations['policy.posture.dev/description']", value: "Every container runs as a non-root user." }
    asserts:
      - equal: { path: "spec.variables[4].name", value: podRunAsNonRoot }
      - equal: { path: "spec.variables[5].name", value: exempt }
      - equal: { path: "metadata.annotations['policy.posture.dev/pss']", value: baseline }
        documentSelector: { path: "metadata.annotations['policy.posture.dev/description']", value: "Containers may not bind ports on the node (hostPort)." }
      - equal: { path: "metadata.annotations['policy.posture.dev/nist']", value: "CM-7, SC-7" }
        documentSelector: { path: "metadata.annotations['policy.posture.dev/description']", value: "Containers may not bind ports on the node (hostPort)." }
      - lengthEqual: { path: spec.validations, count: 1 }
        documentSelector: { path: "metadata.annotations['policy.posture.dev/description']", value: "Containers may not bind ports on the node (hostPort)." }
      - equal: { path: "metadata.annotations['policy.posture.dev/pss']", value: restricted }
        documentSelector: { path: "metadata.annotations['policy.posture.dev/description']", value: "Every container sets allowPrivilegeEscalation to false." }
      - equal: { path: "metadata.annotations['policy.posture.dev/nist']", value: "AC-6" }
        documentSelector: { path: "metadata.annotations['policy.posture.dev/description']", value: "Every container sets allowPrivilegeEscalation to false." }
      - lengthEqual: { path: spec.validations, count: 1 }
        documentSelector: { path: "metadata.annotations['policy.posture.dev/description']", value: "Every container sets allowPrivilegeEscalation to false." }
      - equal: { path: "metadata.annotations['policy.posture.dev/pss']", value: restricted }
        documentSelector: { path: "metadata.annotations['policy.posture.dev/description']", value: "Every container drops ALL capabilities and adds back nothing but NET_BIND_SERVICE." }
      - equal: { path: "metadata.annotations['policy.posture.dev/nist']", value: "AC-6, CM-7" }
        documentSelector: { path: "metadata.annotations['policy.posture.dev/description']", value: "Every container drops ALL capabilities and adds back nothing but NET_BIND_SERVICE." }
      - lengthEqual: { path: spec.validations, count: 2 }
        documentSelector: { path: "metadata.annotations['policy.posture.dev/description']", value: "Every container drops ALL capabilities and adds back nothing but NET_BIND_SERVICE." }
      - equal: { path: "metadata.annotations['policy.posture.dev/pss']", value: restricted }
        documentSelector: { path: "metadata.annotations['policy.posture.dev/description']", value: "Every container runs under a RuntimeDefault or Localhost seccomp profile." }
      - equal: { path: "metadata.annotations['policy.posture.dev/nist']", value: "CM-7, SC-39" }
        documentSelector: { path: "metadata.annotations['policy.posture.dev/description']", value: "Every container runs under a RuntimeDefault or Localhost seccomp profile." }
      - lengthEqual: { path: spec.validations, count: 1 }
        documentSelector: { path: "metadata.annotations['policy.posture.dev/description']", value: "Every container runs under a RuntimeDefault or Localhost seccomp profile." }
      - equal: { path: "metadata.annotations['policy.posture.dev/pss']", value: baseline }
        documentSelector: { path: "metadata.annotations['policy.posture.dev/description']", value: "AppArmor, where set, uses the runtime default or a node-local profile." }
      - equal: { path: "metadata.annotations['policy.posture.dev/nist']", value: "CM-7, SC-39" }
        documentSelector: { path: "metadata.annotations['policy.posture.dev/description']", value: "AppArmor, where set, uses the runtime default or a node-local profile." }
      - lengthEqual: { path: spec.validations, count: 2 }
        documentSelector: { path: "metadata.annotations['policy.posture.dev/description']", value: "AppArmor, where set, uses the runtime default or a node-local profile." }
      - equal: { path: "metadata.annotations['policy.posture.dev/pss']", value: baseline }
        documentSelector: { path: "metadata.annotations['policy.posture.dev/description']", value: "SELinux options use only the container types, and never set a user or role." }
      - equal: { path: "metadata.annotations['policy.posture.dev/nist']", value: "AC-3, SC-39" }
        documentSelector: { path: "metadata.annotations['policy.posture.dev/description']", value: "SELinux options use only the container types, and never set a user or role." }
      - lengthEqual: { path: spec.validations, count: 2 }
        documentSelector: { path: "metadata.annotations['policy.posture.dev/description']", value: "SELinux options use only the container types, and never set a user or role." }
      - equal: { path: "metadata.annotations['policy.posture.dev/pss']", value: baseline }
        documentSelector: { path: "metadata.annotations['policy.posture.dev/description']", value: "Containers use the default (masked) /proc mount." }
      - equal: { path: "metadata.annotations['policy.posture.dev/nist']", value: "SC-39" }
        documentSelector: { path: "metadata.annotations['policy.posture.dev/description']", value: "Containers use the default (masked) /proc mount." }
      - lengthEqual: { path: spec.validations, count: 1 }
        documentSelector: { path: "metadata.annotations['policy.posture.dev/description']", value: "Containers use the default (masked) /proc mount." }
      - equal: { path: "metadata.annotations['policy.posture.dev/pss']", value: baseline }
        documentSelector: { path: "metadata.annotations['policy.posture.dev/description']", value: "Pods set only the Pod Security Standards' safe sysctls." }
      - equal: { path: "metadata.annotations['policy.posture.dev/nist']", value: "CM-7, SC-39" }
        documentSelector: { path: "metadata.annotations['policy.posture.dev/description']", value: "Pods set only the Pod Security Standards' safe sysctls." }
      - lengthEqual: { path: spec.validations, count: 1 }
        documentSelector: { path: "metadata.annotations['policy.posture.dev/description']", value: "Pods set only the Pod Security Standards' safe sysctls." }
      - equal: { path: "metadata.annotations['policy.posture.dev/pss']", value: restricted }
        documentSelector: { path: "metadata.annotations['policy.posture.dev/description']", value: "Volumes are only of the Pod Security restricted types." }
      - equal: { path: "metadata.annotations['policy.posture.dev/nist']", value: "CM-7" }
        documentSelector: { path: "metadata.annotations['policy.posture.dev/description']", value: "Volumes are only of the Pod Security restricted types." }
      - lengthEqual: { path: spec.validations, count: 1 }
        documentSelector: { path: "metadata.annotations['policy.posture.dev/description']", value: "Volumes are only of the Pod Security restricted types." }
