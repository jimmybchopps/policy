# The controller counterpart of bad-registry-pod.yaml: an image from a registry no example
# allows. Admitted with a warning (controllers only warn).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bad-registry
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: bad-registry }
  template:
    metadata:
      labels: { app.kubernetes.io/name: bad-registry }
    spec:
      containers:
        - name: app
          image: docker.io/library/busybox:1.37
