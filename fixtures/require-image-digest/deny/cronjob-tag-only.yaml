# A tag, no digest.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cronjob-tag-only
spec:
  schedule: "0 3 * * *"
  jobTemplate:
    spec:
      template:
        metadata:
          labels: { app.kubernetes.io/name: cronjob-tag-only, e2e.test/fixture: "true" }
        spec:
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          serviceAccountName: app
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: app
              image: registry.example.mil/app:1.4.2
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: [ALL] }
              resources:
                requests: { cpu: 10m, memory: 16Mi }
                limits: { memory: 16Mi }
