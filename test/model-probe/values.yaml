# Values for the real chart (a subchart here). Its own validate.yaml builds the model from the
# real definitions on every render, so they must be valid.
policy:
  policies:
    restrict-image-registries:
      registries: [registry.example.mil/]

# The model's input under test: what the user would set (enforcement, policies, custom).
input: {}

# The chart version the model reads since against (the real chart passes .Chart.Version).
chartVersion: 0.1.0

# The definitions under test, in the definition format (each with a source path).
definitions: []

# The mutation definitions under test (definitions/mutating/ format, each with a source path).
mutationDefinitions: []
