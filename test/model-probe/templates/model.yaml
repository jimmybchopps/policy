{{- /*
One document for the model's top-level fields (probe: Model), then one per policy (probe: Policy),
so tests can pick a policy with documentSelector on its name.
*/ -}}
{{- $model := include "policy.model" (dict "Values" .Values.input "definitions" .Values.definitions) | fromJson -}}
probe: Model
name: model
{{ omit $model "policies" | toYaml }}
{{- $names := list -}}
{{- range $model.policies }}{{ $names = append $names .name }}{{ end }}
names: {{ toJson $names }}
{{- range $model.policies }}
---
probe: Policy
{{ toYaml . }}
{{- end }}
