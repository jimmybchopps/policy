        not: true

  - it: each policy's controls (PSS level, NIST) and validation count follow its definition
    asserts:
      - equal: { path: "metadata.annotations['policy.posture.dev/pss']", value: baseline }
        documentSelector: { path: "metadata.annotations['policy.posture.dev/description']", value: "Containers may not run privileged or as Windows HostProcess." }
      - equal: { path: "metadata.annotations['policy.posture.dev/nist']", value: "AC-6, CM-7" }
        documentSelector: { path: "metadata.annotations['policy.posture.dev/description']", value: "Containers may not run privileged or as Windows HostProcess." }
      - lengthEqual: { path: spec.validations, count: 2 }
        documentSelector: { path: "metadata.annotations['policy.posture.dev/description']", value: "Containers may not run privileged or as Windows HostProcess." }
      - equal: { path: "metadata.annotations['policy.posture.dev/pss']", value: baseline }
        documentSelector: { path: "metadata.annotations['policy.posture.dev/description']", value: "Pods may not share the node's network, process, or IPC namespaces." }
      - lengthEqual: { path: spec.validations, count: 3 }
        documentSelector: { path: "metadata.annotations['policy.posture.dev/description']", value: "Pods may not share the node's network, process, or IPC namespaces." }
      - equal: { path: "metadata.annotations['policy.posture.dev/nist']", value: "AC-6, SC-39" }
        documentSelector: { path: "metadata.annotations['policy.posture.dev/description']", value: "Pods may not mount directories from the node (hostPath volumes)." }
      - lengthEqual: { path: spec.validations, count: 1 }
        documentSelector: { path: "metadata.annotations['policy.posture.dev/description']", value: "Pods may not mount directories from the node (hostPath volumes)." }
      - equal: { path: "metadata.annotations['policy.posture.dev/pss']", value: restricted }
        documentSelector: { path: "metadata.annotations['policy.posture.dev/description']", value: "Every container runs as a non-root user." }
      - equal: { path: "metadata.annotations['policy.posture.dev/nist']", value: AC-6 }
        documentSelector: { path: "metadata.annotations['policy.posture.dev/description']", value: "Every container runs as a non-root user." }
      - lengthEqual: { path: spec.validations, count: 2 }
        documentSelector: { path: "metadata.annotations['policy.posture.dev/description']", value: "Every container runs as a non-root user." }

  - it: require-run-as-non-root keeps its own variable after the shared ones, before exempt
    documentSelector: { path: "metadata.annotations['policy.posture.dev/description']", value: "Every container runs as a non-root user." }
    asserts:
      - equal: { path: "spec.variables[4].name", value: podRunAsNonRoot }
      - equal: { path: "spec.variables[5].name", value: exempt }
      - equal: { path: "metadata.annotations['policy.posture.dev/pss']", value: baseline }
        documentSelector: { path: "metadata.annotations['policy.posture.dev/description']", value: "Containers may not bind ports on the node (hostPort)." }
      - equal: { path: "metadata.annotations['policy.posture.dev/nist']", value: "CM-7, SC-7" }
        documentSelector: { path: "metadata.annotations['policy.posture.dev/description']", value: "Containers may not bind ports on the node (hostPort)." }
      - lengthEqual: { path: spec.validations, count: 1 }
        documentSelector: { path: "metadata.annotations['policy.posture.dev/description']", value: "Containers may not bind ports on the node (hostPort)." }
      - equal: { path: "metadata.annotations['policy.posture.dev/pss']", value: restricted }
        documentSelector: { path: "metadata.annotations['policy.posture.dev/description']", value: "Every container sets allowPrivilegeEscalation to false." }
      - equal: { path: "metadata.annotations['policy.posture.dev/nist']", value: "AC-6" }
        documentSelector: { path: "metadata.annotations['policy.posture.dev/description']", value: "Every container sets allowPrivilegeEscalation to false." }
      - lengthEqual: { path: spec.validations, count: 1 }
        documentSelector: { path: "metadata.annotations['policy.posture.dev/description']", value: "Every container sets allowPrivilegeEscalation to false." }
      - equal: { path: "metadata.annotations['policy.posture.dev/pss']", value: restricted }
        documentSelector: { path: "metadata.annotations['policy.posture.dev/description']", value: "Every container drops ALL capabilities and adds back nothing but NET_BIND_SERVICE." }
      - equal: { path: "metadata.annotations['policy.posture.dev/nist']", value: "AC-6, CM-7" }
        documentSelector: { path: "metadata.annotations['policy.posture.dev/description']", value: "Every container drops ALL capabilities and adds back nothing but NET_BIND_SERVICE." }
      - lengthEqual: { path: spec.validations, count: 2 }
        documentSelector: { path: "metadata.annotations['policy.posture.dev/description']", value: "Every container drops ALL capabilities and adds back nothing but NET_BIND_SERVICE." }
      - equal: { path: "metadata.annotations['policy.posture.dev/pss']", value: restricted }
        documentSelector: { path: "metadata.annotations['policy.posture.dev/description']", value: "Every container runs under a RuntimeDefault or Localhost seccomp profile." }
      - equal: { path: "metadata.annotations['policy.posture.dev/nist']", value: "CM-7, SC-39" }
        documentSelector: { path: "metadata.annotations['policy.posture.dev/description']", value: "Every container runs under a RuntimeDefault or Localhost seccomp profile." }
      - lengthEqual: { path: spec.validations, count: 1 }
        documentSelector: { path: "metadata.annotations['policy.posture.dev/description']", value: "Every container runs under a RuntimeDefault or Localhost seccomp profile." }
      - equal: { path: "metadata.annotations['policy.posture.dev/pss']", value: baseline }
        documentSelector: { path: "metadata.annotations['policy.posture.dev/description']", value: "AppArmor, where set, uses the runtime default or a node-local profile." }
      - equal: { path: "metadata.annotations['policy.posture.dev/nist']", value: "CM-7, SC-39" }
        documentSelector: { path: "metadata.annotations['policy.posture.dev/description']", value: "AppArmor, where set, uses the runtime default or a node-local profile." }
      - lengthEqual: { path: spec.validations, count: 2 }
        documentSelector: { path: "metadata.annotations['policy.posture.dev/description']", value: "AppArmor, where set, uses the runtime default or a node-local profile." }
      - equal: { path: "metadata.annotations['policy.posture.dev/pss']", value: baseline }
        documentSelector: { path: "metadata.annotations['policy.posture.dev/description']", value: "SELinux options use only the container types, and never set a user or role." }
      - equal: { path: "metadata.annotations['policy.posture.dev/nist']", value: "AC-3, SC-39" }
        documentSelector: { path: "metadata.annotations['policy.posture.dev/description']", value: "SELinux options use only the container types, and never set a user or role." }
      - lengthEqual: { path: spec.validations, count: 2 }
        documentSelector: { path: "metadata.annotations['policy.posture.dev/description']", value: "SELinux options use only the container types, and never set a user or role." }
      - equal: { path: "metadata.annotations['policy.posture.dev/pss']", value: baseline }
        documentSelector: { path: "metadata.annotations['policy.posture.dev/description']", value: "Containers use the default (masked) /proc mount." }
      - equal: { path: "metadata.annotations['policy.posture.dev/nist']", value: "SC-39" }
        documentSelector: { path: "metadata.annotations['policy.posture.dev/description']", value: "Containers use the default (masked) /proc mount." }
      - lengthEqual: { path: spec.validations, count: 1 }
        documentSelector: { path: "metadata.annotations['policy.posture.dev/description']", value: "Containers use the default (masked) /proc mount." }
