name: disallow-secrets-in-env
tier: optional
default: { enabled: true, action: audit }
description: Secrets are mounted as files, not passed in environment variables.
controls:
  nist: [SC-28]
resources: workloads
operations: [CREATE, UPDATE]
validations:
  - expression: >-
      !variables.allContainers.exists(c,
        (has(c.env) && c.env.exists(e, has(e.valueFrom) && has(e.valueFrom.secretKeyRef))) ||
        (has(c.envFrom) && c.envFrom.exists(e, has(e.secretRef))))
    message: >-
      containers[*].env[*].valueFrom.secretKeyRef and containers[*].envFrom[*].secretRef must
      be unset; mount the Secret as a volume instead. If this workload needs it, add a posture
      exception for disallow-secrets-in-env.
