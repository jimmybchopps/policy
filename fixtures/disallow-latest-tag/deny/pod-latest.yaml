# The latest tag.
apiVersion: v1
kind: Pod
metadata:
  name: pod-latest
  labels: { app.kubernetes.io/name: pod-latest, e2e.test/fixture: "true" }
spec:
  automountServiceAccountToken: false
  serviceAccountName: app
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    seccompProfile: { type: RuntimeDefault }
  containers:
    - name: app
      image: registry.example.mil/app:latest
      readinessProbe: { tcpSocket: { port: 8080 } }
      livenessProbe: { tcpSocket: { port: 8080 } }
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: { drop: [ALL] }
      resources:
        requests: { cpu: 10m, memory: 16Mi }
        limits: { memory: 16Mi }
