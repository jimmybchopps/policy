# Snapshots of every example's rendered output. After an intended change, review the diff and
# update with: make unittest-update
suite: examples
templates:
  - templates/crd.yaml
  - templates/validating.yaml
  - templates/mutating.yaml
  - templates/dashboard.yaml
release:
  name: policy
tests:
  - it: minimal
    values: [../../../examples/minimal.yaml]
    asserts:
      - matchSnapshot: {}

  - it: mutations
    values: [../../../examples/mutations.yaml]
    asserts:
      - matchSnapshot: {}

  - it: reporting
    values: [../../../examples/reporting.yaml]
    asserts:
      - matchSnapshot: {}
