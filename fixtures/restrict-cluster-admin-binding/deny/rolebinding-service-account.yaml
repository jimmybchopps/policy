# ClusterRole cluster-admin bound in a namespace, for a ServiceAccount not in allowedSubjects.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: e2e-cluster-admin-sa
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: cluster-admin }
subjects:
  - { kind: ServiceAccount, name: app, namespace: apps }
