# The values schema (values.schema.json, generated from the definitions by make values-schema).
# NOTES.txt renders nothing that depends on these values, so a failure here is the schema's.
suite: values schema
templates:
  - templates/NOTES.txt
values:
  - ../../../examples/minimal.yaml
tests:
  - it: accepts the minimal example
    asserts:
      - notFailedTemplate: {}

  - it: rejects a top-level key that isn't built yet
    set:
      mutations: { enabled: true }
    asserts:
      - failedTemplate:
          errorPattern: "mutations"

  # ---- enforcement
  - it: accepts enforcement audit
    set:
      enforcement: audit
    asserts:
      - notFailedTemplate: {}

  - it: rejects an unknown enforcement
    set:
      enforcement: warn
    asserts:
      - failedTemplate:
          errorPattern: "enforcement"

  # ---- policies
  - it: rejects an unknown policy
    set:
      policies:
        disallow-everything: {}
    asserts:
      - failedTemplate:
          errorPattern: "disallow-everything"

  - it: rejects enabled on a baked-in policy
    set:
      policies:
        restrict-image-registries:
          enabled: false
    asserts:
      - failedTemplate:
          errorPattern: "enabled"

  - it: rejects action on a baked-in policy without settings
    set:
      policies:
        disallow-host-path:
          action: audit
    asserts:
      - failedTemplate:
          errorPattern: "action"

  - it: rejects a registry that isn't a string
    set:
      policies:
        restrict-image-registries:
          registries: [42]
    asserts:
      - failedTemplate:
          errorPattern: "registries"

  - it: rejects an empty registry prefix
    set:
      policies:
        restrict-image-registries:
          registries: [""]
    asserts:
      - failedTemplate:
          errorPattern: "registries"

  - it: accepts enabled, action, and settings on an optional policy
    set:
      policies:
        disallow-pod-exec: { enabled: true, action: audit, namespaces: [debug] }
        restrict-wildcard-rbac: { allowedRoles: [my-operator] }
    asserts:
      - notFailedTemplate: {}

  - it: rejects an unknown action on an optional policy
    set:
      policies:
        require-read-only-root-filesystem: { action: warn }
    asserts:
      - failedTemplate:
          errorPattern: "action"

  - it: rejects a setting an optional policy doesn't declare
    set:
      policies:
        require-read-only-root-filesystem: { namespaces: [x] }
    asserts:
      - failedTemplate:
          errorPattern: "namespaces"

  # ---- custom
  - it: accepts a custom policy in the definition format
    set:
      custom:
        require-team-label:
          description: Every workload carries a team label.
          action: enforce
          validations:
            - expression: "'team' in variables.workloadLabels"
              message: "Add a 'team' label to the pod template."
    asserts:
      - notFailedTemplate: {}

  - it: rejects a custom policy without validations
    set:
      custom:
        empty: { description: x }
    asserts:
      - failedTemplate:
          errorPattern: "validations"

  - it: rejects tier on a custom policy
    set:
      custom:
        tiered: { description: x, tier: baked-in, validations: [{ expression: "true", message: x }] }
    asserts:
      - failedTemplate:
          errorPattern: "tier"

  - it: rejects a namespaceSelector in a custom matchConstraints block
    set:
      custom:
        scoped:
          description: x
          resources:
            namespaceSelector: { matchLabels: { team: a } }
            resourceRules: [{ apiGroups: [""], apiVersions: [v1], resources: [configmaps] }]
          validations: [{ expression: "true", message: x }]
    asserts:
      - failedTemplate:
          errorPattern: "namespaceSelector"

  - it: rejects a custom policy name that isn't a DNS label
    set:
      custom:
        Not_A_Name: { description: x, validations: [{ expression: "true", message: x }] }
    asserts:
      - failedTemplate:
          errorPattern: "Not_A_Name"

  - it: accepts the e2e settings scenario's values (enforcement audit and a custom policy)
    values: [../../../examples/minimal.yaml, ../../../test/e2e/values/settings.yaml]
    asserts:
      - notFailedTemplate: {}

  # ---- list settings with an item schema
  - it: accepts disallow-mesh-opt-out markers
    set:
      policies:
        disallow-mesh-opt-out:
          markers: [{ kind: label, key: example.mil/mesh, value: "off" }]
    asserts:
      - notFailedTemplate: {}

  - it: rejects a marker with an unknown kind
    set:
      policies:
        disallow-mesh-opt-out:
          markers: [{ kind: env, key: MESH, value: "off" }]
    asserts:
      - failedTemplate:
          errorPattern: "markers"

  - it: rejects a marker without a value
    set:
      policies:
        disallow-mesh-opt-out:
          markers: [{ kind: label, key: example.mil/mesh }]
    asserts:
      - failedTemplate:
          errorPattern: "markers"

  - it: accepts cluster-admin subjects (a ServiceAccount with its namespace, a group)
    set:
      policies:
        restrict-cluster-admin-binding:
          allowedSubjects: [{ kind: ServiceAccount, name: deployer, namespace: ci }, { kind: Group, name: platform-admins }]
    asserts:
      - notFailedTemplate: {}

  - it: rejects a cluster-admin subject with an unknown kind
    set:
      policies:
        restrict-cluster-admin-binding:
          allowedSubjects: [{ kind: Robot, name: x }]
    asserts:
      - failedTemplate:
          errorPattern: "allowedSubjects"

  - it: rejects a ServiceAccount subject without a namespace
    set:
      policies:
        restrict-cluster-admin-binding:
          allowedSubjects: [{ kind: ServiceAccount, name: deployer }]
    asserts:
      - failedTemplate:
          errorPattern: "allowedSubjects"

  - it: rejects a namespace on a User subject
    set:
      policies:
        restrict-cluster-admin-binding:
          allowedSubjects: [{ kind: User, name: alice, namespace: ci }]
    asserts:
      - failedTemplate:
          errorPattern: "allowedSubjects"
