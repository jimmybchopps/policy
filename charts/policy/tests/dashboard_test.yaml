# The Grafana dashboard ConfigMap (reporting.grafanaDashboard). The panels themselves are
# checked against the API server's metrics in e2e (check_metrics).
suite: dashboard
templates:
  - templates/dashboard.yaml
release:
  name: policy
  namespace: policy
values:
  - ../../../examples/minimal.yaml
tests:
  - it: renders nothing by default
    asserts:
      - hasDocuments: { count: 0 }

  - it: renders a ConfigMap the Grafana sidecar picks up, in the release namespace
    set:
      reporting: { grafanaDashboard: { enabled: true } }
    asserts:
      - hasDocuments: { count: 1 }
      - isKind: { of: ConfigMap }
      - equal: { path: metadata.name, value: policy-dashboard }
      - equal: { path: metadata.namespace, value: policy }
      - equal: { path: "metadata.labels.grafana_dashboard", value: "1" }
      - equal: { path: "metadata.labels['app.kubernetes.io/name']", value: policy }
      - notExists: { path: metadata.annotations }
      - exists: { path: "data['admission-policies.json']" }

  - it: takes labels and annotations, and stays in the release namespace
    values: [../../../examples/minimal.yaml, ../../../examples/reporting.yaml]
    set:
      reporting: { grafanaDashboard: { labels: { team: security } } }
    asserts:
      - equal: { path: metadata.namespace, value: policy }
      - equal: { path: metadata.annotations, value: { grafana_folder: Security } }
      - equal: { path: "metadata.labels.team", value: security }

  - it: filters every query to this release's enabled policies
    set:
      reporting: { grafanaDashboard: { enabled: true } }
    asserts:
      - notMatchRegex: { path: "data['admission-policies.json']", pattern: "__POLICIES__" }
      - matchRegex: { path: "data['admission-policies.json']", pattern: "policy=~\\\\\"disallow-automount-service-account-token\\|disallow-default-namespace\\|" }
      - matchRegex: { path: "data['admission-policies.json']", pattern: "\\|restrict-wildcard-rbac\\\\\"" }
      - notMatchRegex: { path: "data['admission-policies.json']", pattern: "disallow-pod-exec" }
      - notMatchRegex: { path: "data['admission-policies.json']", pattern: "add-default-security-context" }
      - matchRegex: { path: "data['admission-policies.json']", pattern: "\"uid\": \"policy-admission\"" }

  - it: includes enabled optional policies and mutations
    set:
      policies: { disallow-pod-exec: { enabled: true } }
      mutations: { enabled: true }
      reporting: { grafanaDashboard: { enabled: true } }
    asserts:
      - matchRegex: { path: "data['admission-policies.json']", pattern: "disallow-pod-exec" }
      - matchRegex: { path: "data['admission-policies.json']", pattern: "add-default-security-context" }
      - notMatchRegex: { path: "data['admission-policies.json']", pattern: "add-default-resources" }
