name: disallow-automount-service-account-token
tier: optional
default: { enabled: true, action: audit }
description: Pods set automountServiceAccountToken to false.
controls:
  nist: [AC-6]
resources: workloads
operations: [CREATE, UPDATE]
validations:
  # The ServiceAccount's own setting isn't visible at admission, so the pod must say so.
  - expression: >-
      has(variables.podSpec.automountServiceAccountToken) &&
      !variables.podSpec.automountServiceAccountToken
    message: >-
      spec.automountServiceAccountToken must be false; mount a projected token only where the
      workload calls the API. If this workload needs the token, add a posture exception for
      disallow-automount-service-account-token.
