name: disallow-default-service-account
tier: optional
default: { enabled: true, action: audit }
description: Pods run as a service account of their own, not default.
controls:
  nist: [AC-6]
resources: workloads
operations: [CREATE, UPDATE]
validations:
  # A Pod that leaves it unset has default filled in by the ServiceAccount admission plugin
  # before policies run; a template that leaves it unset is checked as unset.
  - expression: >-
      has(variables.podSpec.serviceAccountName) &&
      variables.podSpec.serviceAccountName != '' &&
      variables.podSpec.serviceAccountName != 'default'
    message: >-
      spec.serviceAccountName must name a service account other than default. If this
      workload needs default, add a posture exception for disallow-default-service-account.
