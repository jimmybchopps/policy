# type: LoadBalancer in a namespace listed in policies.restrict-loadbalancer-services.namespaces (the catalog scenario sets lb-allowed): admitted.
apiVersion: v1
kind: Service
metadata:
  name: loadbalancer
  labels: { app.kubernetes.io/name: loadbalancer, e2e.test/fixture: "true" }
spec:
  type: LoadBalancer
  selector: { app.kubernetes.io/name: app }
  ports: [{ name: http, port: 80, targetPort: 8080 }]
