# restrict-route-hostnames, checked in apps with domains example.mil and svc.example.org
# (test/e2e/scenarios/catalog.sh). The parent Gateway needn't exist: admission doesn't look.
# Deny: a domain not in domains.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: unlisted-domain
spec:
  parentRefs:
    - { name: e2e-gateway, namespace: gateway }
  hostnames:
    - "web.apps.example.com"
  rules:
    - backendRefs:
        - { name: web, port: 8080 }
