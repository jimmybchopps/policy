suite: NOTES.txt
templates:
  - templates/NOTES.txt
release:
  name: policy
values:
  - ../../../examples/minimal.yaml
tests:
  - it: names the chart version, the release, and the Kubernetes floor
    chart:
      version: 9.8.7
    asserts:
      - matchRegexRaw: { pattern: "policy 9\\.8\\.7 is installed \\(release policy\\)" }
      - matchRegexRaw: { pattern: "Kubernetes 1\\.30\\+" }

  - it: lists no new policies (no definition sets since yet)
    asserts:
      - notMatchRegexRaw: { pattern: "New in|New baked-in" }

  - it: summarizes what's on with the minimal example
    asserts:
      - matchRegexRaw: { pattern: "Enforcement: enforce \\(optional and custom policies with action inherit\\)\\." }
      - matchRegexRaw: { pattern: "Baked-in policies, always enforced: 15\\." }
      - matchRegexRaw: { pattern: "Optional policies on: 18\\.\\n  enforce: disallow-default-namespace, " }
      - matchRegexRaw: { pattern: "\\n  audit: disallow-automount-service-account-token, " }
      - matchRegexRaw: { pattern: "Optional policies off: disallow-ephemeral-containers, disallow-pod-exec\\." }
      - matchRegexRaw: { pattern: "Mutations: off\\." }
      - matchRegexRaw: { pattern: "Never evaluated: kube-system\\." }
      - matchRegexRaw: { pattern: "needs its posture-exceptions object" }
      - notMatchRegexRaw: { pattern: "Custom policies|Grafana dashboard" }

  - it: shows enforcement audit
    set:
      enforcement: audit
    asserts:
      - matchRegexRaw: { pattern: "Enforcement: audit " }
      - notMatchRegexRaw: { pattern: "\\n  enforce: " }

  - it: lists custom policies with their action
    set:
      custom:
        require-team-label: { description: x, action: audit, validations: [{ expression: "true", message: x }] }
    asserts:
      - matchRegexRaw: { pattern: "Custom policies: require-team-label \\(audit\\)\\." }

  - it: lists the mutations and their API version
    values: [../../../examples/minimal.yaml, ../../../examples/mutations.yaml]
    asserts:
      - matchRegexRaw: { pattern: "Mutations \\(v1\\): add-default-resources, add-default-security-context, disable-service-account-token-automount\\." }

  - it: names the dashboard ConfigMap when it's on
    release:
      namespace: policy
    values: [../../../examples/minimal.yaml, ../../../examples/reporting.yaml]
    asserts:
      - matchRegexRaw: { pattern: "Grafana dashboard: ConfigMap policy-dashboard in policy; Grafana's dashboard sidecar must search this namespace" }

  # examples/strict.yaml is every optional policy at enforce and every mutation on. A new optional
  # policy or mutation fails here until it's added to examples/strict.yaml.
  - it: examples/strict.yaml turns on every optional policy at enforce (add new ones there)
    values: [../../../examples/strict.yaml]
    asserts:
      - matchRegexRaw: { pattern: "Optional policies off: none\\." }
      - notMatchRegexRaw: { pattern: "\\n  audit: " }
      - matchRegexRaw: { pattern: "Mutations \\(v1\\): add-default-resources, add-default-security-context, disable-service-account-token-automount\\." }

  - it: examples/default.yaml turns on the security-context mutation and the dashboard
    release:
      namespace: policy
    values: [../../../examples/default.yaml]
    asserts:
      - matchRegexRaw: { pattern: "Mutations \\(v1\\): add-default-security-context\\." }
      - matchRegexRaw: { pattern: "Grafana dashboard: ConfigMap policy-dashboard in policy;" }
