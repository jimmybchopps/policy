name: require-drop-all-capabilities
tier: baked-in
description: Every container drops ALL capabilities and adds back nothing but NET_BIND_SERVICE.
controls:
  pss: restricted
  nist: [AC-6, CM-7]
resources: workloads
operations: [CREATE, UPDATE]
validations:
  - expression: >-
      variables.allContainers.all(c,
        has(c.securityContext) && has(c.securityContext.capabilities) &&
        has(c.securityContext.capabilities.drop) &&
        'ALL' in c.securityContext.capabilities.drop)
    message: >-
      containers[*].securityContext.capabilities.drop must include ALL. If this workload needs
      to keep a capability, add a posture exception for require-drop-all-capabilities.
  - expression: >-
      variables.allContainers.all(c,
        !has(c.securityContext) || !has(c.securityContext.capabilities) ||
        !has(c.securityContext.capabilities.add) ||
        c.securityContext.capabilities.add.all(a, a == 'NET_BIND_SERVICE'))
    message: >-
      containers[*].securityContext.capabilities.add may contain only NET_BIND_SERVICE. If this
      workload needs another capability, add a posture exception for
      require-drop-all-capabilities.
