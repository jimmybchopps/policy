# restrict-route-hostnames, checked in apps with domains example.mil and svc.example.org
# (test/e2e/scenarios/catalog.sh). The parent Gateway needn't exist: admission doesn't look.
# Admit: hostnames under either listed domain.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: second-domain
spec:
  parentRefs:
    - { name: e2e-gateway, namespace: gateway }
  hostnames:
    - "web.apps.example.mil"
    - "web.apps.svc.example.org"
  rules:
    - backendRefs:
        - { name: web, port: 8080 }
