name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  chart:
    name: chart (helm ${{ matrix.helm }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with HELM_VERSIONS in the Makefile: oldest supported, latest 3.x, latest 4.x.
        helm: ["3.14.4", "3.22.1", "4.3.1"]
    env:
      HELM_VERSION: ${{ matrix.helm }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          path: .bin
          key: tools-${{ runner.os }}-helm-${{ matrix.helm }}-${{ hashFiles('Makefile') }}

      - name: Install tools
        run: make tools

      - name: helm lint --strict
        run: make lint

      - name: definitions schema
        run: make check-definitions

      - name: fixtures cover every policy
        run: make check-fixtures

      - name: values schema is current
        run: make check-values-schema

      - name: helm unittest
        run: make unittest

      - name: kubeconform (examples/, fixtures/)
        run: make validate

  e2e:
    name: e2e (k3d)
    needs: chart
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HELM_VERSION: "4.3.1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          path: .bin
          key: tools-e2e-${{ runner.os }}-${{ hashFiles('Makefile') }}

      - name: e2e (k3d, server-side dry-run)
        run: make e2e
