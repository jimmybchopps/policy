# The exempt namespace's exceptions, written exactly as posture renders them: one entry per
# policy (sorted by kind, then name) with its workloads. Every policy that takes exceptions is
# excepted for the fixtures (e2e.test/fixture=true; lib.sh's require_exempt_covers checks none
# is missing), plus:
#   - a MutatingAdmissionPolicy entry named restrict-image-registries, which must NOT exempt
#     the ValidatingAdmissionPolicy of that name (wrong-kind-pod.yaml);
#   - a disallow-host-namespaces entry needing two labels, both of which must match
#     (partial-labels-pod.yaml is denied, both-labels-pod.yaml admitted).
apiVersion: policy.posture.dev/v1alpha1
kind: PolicyExceptions
metadata:
  name: posture-exceptions
  annotations: { posture.dev/rule: exceptions }
spec:
  exceptions:
    - policy: { kind: MutatingAdmissionPolicy, name: restrict-image-registries }
      workloads:
        - matchLabels: { e2e.test/wrong-kind: "true" }
          reason: e2e, a mutating exception never exempts a validating policy
    - policy: { kind: ValidatingAdmissionPolicy, name: disallow-automount-service-account-token }
      workloads:
        - matchLabels: { e2e.test/fixture: "true" }
          reason: e2e fixture
    - policy: { kind: ValidatingAdmissionPolicy, name: disallow-default-namespace }
      workloads:
        - matchLabels: { e2e.test/fixture: "true" }
          reason: e2e fixture
    - policy: { kind: ValidatingAdmissionPolicy, name: disallow-default-service-account }
      workloads:
        - matchLabels: { e2e.test/fixture: "true" }
          reason: e2e fixture
    - policy: { kind: ValidatingAdmissionPolicy, name: disallow-ephemeral-containers }
      workloads:
        - matchLabels: { e2e.test/fixture: "true" }
          reason: e2e fixture
    - policy: { kind: ValidatingAdmissionPolicy, name: disallow-host-namespaces }
      workloads:
        - matchLabels: { e2e.test/a: "1", e2e.test/b: "2" }
          reason: e2e, every label must match
        - matchLabels: { e2e.test/fixture: "true" }
          reason: e2e fixture
    - policy: { kind: ValidatingAdmissionPolicy, name: disallow-host-path }
      workloads:
        - matchLabels: { e2e.test/fixture: "true" }
          reason: e2e fixture
    - policy: { kind: ValidatingAdmissionPolicy, name: disallow-host-ports }
      workloads:
        - matchLabels: { e2e.test/fixture: "true" }
          reason: e2e fixture
    - policy: { kind: ValidatingAdmissionPolicy, name: disallow-latest-tag }
      workloads:
        - matchLabels: { e2e.test/fixture: "true" }
          reason: e2e fixture
    - policy: { kind: ValidatingAdmissionPolicy, name: disallow-mesh-opt-out }
      workloads:
        - matchLabels: { e2e.test/fixture: "true" }
          reason: e2e fixture
    - policy: { kind: ValidatingAdmissionPolicy, name: disallow-nodeport-services }
      workloads:
        - matchLabels: { e2e.test/fixture: "true" }
          reason: e2e fixture
    - policy: { kind: ValidatingAdmissionPolicy, name: disallow-privilege-escalation }
      workloads:
        - matchLabels: { e2e.test/fixture: "true" }
          reason: e2e fixture
    - policy: { kind: ValidatingAdmissionPolicy, name: disallow-privileged-containers }
      workloads:
        - matchLabels: { e2e.test/fixture: "true" }
          reason: e2e fixture
    - policy: { kind: ValidatingAdmissionPolicy, name: disallow-secrets-in-env }
      workloads:
        - matchLabels: { e2e.test/fixture: "true" }
          reason: e2e fixture
    - policy: { kind: ValidatingAdmissionPolicy, name: disallow-shared-process-namespace }
      workloads:
        - matchLabels: { e2e.test/fixture: "true" }
