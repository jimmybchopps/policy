{{- /*
The values schema for charts/policy. Reads, as copied in by `make values-schema`:
  definitions/validating/*.yaml   one entry per policy under policies
  definitions/mutating/*.yaml     one entry per mutation under mutations.policies
  definition.schema.json          the definition format, reused for custom.<name>
*/ -}}
{{- $defSchema := .Files.Get "definition.schema.json" | fromJson -}}
{{- if not $defSchema.properties -}}{{- fail "values-schema: definition.schema.json is missing; run make values-schema" -}}{{- end -}}
{{- $actionEnum := list "inherit" "enforce" "audit" -}}

{{- /* policies.<name> */ -}}
{{- $policies := dict -}}
{{- range $path, $_ := .Files.Glob "definitions/validating/*.yaml" -}}
  {{- $def := $.Files.Get $path | fromYaml -}}
  {{- $props := dict -}}
  {{- range $name, $s := $def.settings | default dict -}}
    {{- $p := dict -}}
    {{- if eq $s.type "list" -}}
      {{- $p = dict "type" "array" "items" ($s.items | default (dict "type" "string" "minLength" 1)) -}}
    {{- else if eq $s.type "string" -}}
      {{- $p = dict "type" "string" -}}
      {{- with $s.pattern -}}{{- $_ := set $p "pattern" . -}}{{- end -}}
    {{- else -}}
      {{- $p = dict "type" "boolean" -}}
    {{- end -}}
    {{- with $s.description -}}{{- $_ := set $p "description" (printf "%s%s." (upper (substr 0 1 .)) (substr 1 (len .) .)) -}}{{- end -}}
    {{- $_ := set $props $name $p -}}
  {{- end -}}
  {{- $summary := "" -}}
  {{- if eq $def.tier "optional" -}}
    {{- $_ := set $props "enabled" (dict "type" "boolean" "description" (printf "Whether the policy is installed (default: %v)." $def.default.enabled)) -}}
    {{- $_ := set $props "action" (dict "type" "string" "enum" $actionEnum "description" (printf "inherit (take enforcement), enforce, or audit (default: %s)." $def.default.action)) -}}
    {{- $summary = printf "Optional (default: %s, %s). %s" (ternary "on" "off" $def.default.enabled) $def.default.action $def.description -}}
    {{- with $def.since -}}{{- $summary = printf "%s New in %s: audits by default while the chart is %s.x." $summary . . -}}{{- end -}}
  {{- else -}}
    {{- $summary = printf "Baked-in: always on and enforced; %s. %s" (ternary (printf "takes only %s" (keys $props | sortAlpha | join ", ")) "takes no settings" (gt (len $props) 0)) $def.description -}}
  {{- end -}}
  {{- $_ := set $policies $def.name (dict "description" $summary "type" "object" "additionalProperties" false "properties" $props) -}}
{{- end -}}

{{- /* mutations.policies.<name>: enabled and the mutation's settings. */ -}}
{{- $mutationPolicies := dict -}}
{{- range $path, $_ := .Files.Glob "definitions/mutating/*.yaml" -}}
  {{- $def := $.Files.Get $path | fromYaml -}}
  {{- $props := dict "enabled" (dict "type" "boolean" "description" (printf "Whether the mutation is installed when mutations.enabled is true (default: %v)." $def.default.enabled)) -}}
  {{- range $name, $s := $def.settings | default dict -}}
    {{- $p := dict "type" "string" -}}
    {{- if eq $s.type "list" -}}{{- $p = dict "type" "array" "items" ($s.items | default (dict "type" "string" "minLength" 1)) -}}
    {{- else if eq $s.type "bool" -}}{{- $p = dict "type" "boolean" -}}
    {{- else -}}{{- with $s.pattern -}}{{- $_ := set $p "pattern" . -}}{{- end -}}
    {{- end -}}
    {{- with $s.description -}}{{- $_ := set $p "description" (printf "%s%s (default: %v)." (upper (substr 0 1 .)) (substr 1 (len .) .) $s.default) -}}{{- end -}}
    {{- $_ := set $props $name $p -}}
  {{- end -}}
  {{- $_ := set $mutationPolicies $def.name (dict "description" (printf "Mutation (default: %s). %s" (ternary "on" "off" $def.default.enabled) $def.description) "type" "object" "additionalProperties" false "properties" $props) -}}
{{- end -}}
{{- $mutations := dict
  "type" "object" "additionalProperties" false
  "description" "Mutations: MutatingAdmissionPolicies that fill in safe defaults on Pods that leave them unset. Off unless enabled."
  "properties" (dict
    "enabled" (dict "type" "boolean" "description" "Install the mutations at all (default: false).")
    "apiVersion" (dict "type" "string" "enum" (list "admissionregistration.k8s.io/v1" "admissionregistration.k8s.io/v1beta1") "description" "MutatingAdmissionPolicy's API version: v1 on Kubernetes 1.36+, v1beta1 on 1.34-1.35 (default: v1).")
    "policies" (dict "type" "object" "additionalProperties" false "properties" $mutationPolicies "description" "Each mutation's enabled and settings, under its name.")) -}}

{{- /* reporting: fixed (not from definitions). */ -}}
{{- $stringMap := dict "type" "object" "additionalProperties" (dict "type" "string") -}}
{{- $reporting := dict
  "type" "object" "additionalProperties" false
  "description" "Reporting on what the policies do."
  "properties" (dict
    "grafanaDashboard" (dict
      "type" "object" "additionalProperties" false
      "description" "A Grafana dashboard (a ConfigMap the Grafana sidecar loads) built on the API server's admission-policy metrics. Always in the release namespace (Grafana's may not exist yet); point the sidecar at it."
      "properties" (dict
        "enabled" (dict "type" "boolean" "description" "Render the dashboard ConfigMap (default: false).")
        "labels" (merge (dict "description" "Labels the Grafana sidecar selects on (default: grafana_dashboard: \"1\").") $stringMap)
        "annotations" (merge (dict "description" "Annotations, e.g. grafana_folder: Security.") $stringMap)))) -}}

{{- /* custom.<name>: the definition format, without what only built-in definitions have
       (name comes from the key; tier is custom; no since, default, or settings), plus enabled and
       action. resources and operations default to workloads and CREATE, UPDATE. */ -}}
{{- $customProps := omit $defSchema.properties "name" "tier" "since" "default" "settings" -}}
{{- $_ := set $customProps "enabled" (dict "type" "boolean" "description" "Whether the policy is installed (default: true).") -}}
{{- $_ := set $customProps "action" (dict "type" "string" "enum" $actionEnum "description" "inherit (take enforcement), enforce, or audit (default: inherit).") -}}
{{- $custom := dict
  "type" "object" "additionalProperties" false
  "required" (list "description" "validations")
  "properties" $customProps -}}

{{- $schema := dict
  "$schema" "http://json-schema.org/draft-07/schema#"
  "title" "policy values"
  "description" "Generated by make values-schema from charts/policy/definitions; don't edit by hand."
  "type" "object"
  "additionalProperties" false
  "properties" (dict
    "enforcement" (dict "type" "string" "enum" (list "enforce" "audit") "description" "How optional and custom policies with action inherit act: enforce (deny and audit Pods) or audit (audit only). Baked-in policies always enforce.")
    "policies" (dict "type" "object" "additionalProperties" false "properties" $policies "description" "Each policy's settings, under its name. Baked-in policies take only their own settings; optional ones also take enabled and action.")
    "mutations" $mutations
    "reporting" $reporting
    "custom" (dict "type" "object" "additionalProperties" $custom "propertyNames" (dict "maxLength" 63 "pattern" "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$") "description" "Your own policies, in the definition format (CLAUDE.md). Names must not collide with built-in policies.")
    "global" (dict "type" "object" "description" "Helm's global values (set when this chart is a dependency); unused.")) -}}
{{ toPrettyJson $schema }}
