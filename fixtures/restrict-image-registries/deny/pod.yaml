# An image from an unlisted registry.
apiVersion: v1
kind: Pod
metadata:
  name: pod
  labels: { app.kubernetes.io/name: pod, e2e.test/fixture: "true" }
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    seccompProfile: { type: RuntimeDefault }
  containers:
    - name: app
      image: docker.io/library/busybox:1.37
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: { drop: [ALL] }
      resources:
        requests: { cpu: 10m, memory: 16Mi }
        limits: { memory: 16Mi }
