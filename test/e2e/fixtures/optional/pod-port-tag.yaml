# A registry port and a tag: admitted by disallow-latest-tag (require-image-digest is excepted).
apiVersion: v1
kind: Pod
metadata:
  name: pod-port-tag
  labels: { app.kubernetes.io/name: pod-port-tag, e2e.test/fixture: "true" }
spec:
  automountServiceAccountToken: false
  serviceAccountName: app
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    seccompProfile: { type: RuntimeDefault }
  containers:
    - name: app
      image: registry.example.mil:5000/app:1.4.2
      readinessProbe: { tcpSocket: { port: 8080 } }
      livenessProbe: { tcpSocket: { port: 8080 } }
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: { drop: [ALL] }
      resources:
        requests: { cpu: 10m, memory: 16Mi }
        limits: { memory: 16Mi }
