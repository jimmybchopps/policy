# cluster-admin for Group e2e-admins, listed in policies.restrict-cluster-admin-binding.allowedSubjects (the catalog scenario sets it): admitted.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: e2e-cluster-admin-allowed
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: cluster-admin }
subjects:
  - { kind: Group, apiGroup: rbac.authorization.k8s.io, name: e2e-admins }
