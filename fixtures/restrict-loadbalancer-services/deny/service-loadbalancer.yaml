# type: LoadBalancer, in a namespace not in policies.restrict-loadbalancer-services.namespaces.
apiVersion: v1
kind: Service
metadata:
  name: service-loadbalancer
  labels: { app.kubernetes.io/name: service-loadbalancer, e2e.test/fixture: "true" }
spec:
  type: LoadBalancer
  selector: { app.kubernetes.io/name: app }
  ports: [{ name: http, port: 80, targetPort: 8080 }]
