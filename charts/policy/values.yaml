# policy: the cluster's admission policies.
#
# Install once per cluster, before anything else. Every key is checked by values.schema.json
# (generated from the policy definitions), so the chart never silently ignores a setting.
#
# The baked-in baseline is fixed: those policies are always on, always enforced, and take no
# settings, except restrict-image-registries, which needs the site's registry list. A
# workload that genuinely needs more gets a per-workload exception through the posture chart
# (reviewed and visible), never a cluster-wide loosening.

# -- How optional and custom policies with action inherit act: enforce (deny and audit Pods,
#    warn on controllers) or audit (audit Pods, warn on controllers). Baked-in policies always
#    enforce.
enforcement: enforce

# -- Each policy's settings, under its name.
#    Baked-in policies take only their own settings (restrict-image-registries: registries).
#    Optional policies also take:
#      enabled: true | false                # default from the policy's definition
#      action: inherit | enforce | audit    # default from the policy's definition
#    plus their own settings, for example:
#      restrict-wildcard-rbac: { allowedRoles: [my-operator-role] }
#      disallow-pod-exec: { enabled: true, namespaces: [debug] }
#    Every policy, its default, and its settings are listed in values.schema.json.
policies:
  # -- Baked-in. Every container image must start with one of these prefixes.
  restrict-image-registries:
    # -- Required: image prefixes, including the trailing "/", e.g.
    #    ["registry.site.mil/", "127.0.0.1:31999/"].
    registries: []

# -- Your own policies, in the definition format (CLAUDE.md, "Definition format"), keyed by
#    name. Exceptions, bindings, and enforcement apply to them as to built-in optional
#    policies. For example:
#      require-team-label:
#        description: Every workload carries a team label.
#        validations:
#          - expression: "'team' in variables.workloadLabels"
#            message: "Add a 'team' label to the pod template."
custom: {}

# -- Mutations: MutatingAdmissionPolicies that fill in safe defaults on Pods that leave them
#    unset, so pods created at runtime (by operators, for example) pass the policies above.
#    They apply to Pods only (never a Deployment's template), never change a value that's
#    already set, and skip a Pod with a posture exception for the mutation.
mutations:
  # -- Install the mutations at all.
  enabled: false
  # -- MutatingAdmissionPolicy's API version: admissionregistration.k8s.io/v1 on Kubernetes
  #    1.36+, admissionregistration.k8s.io/v1beta1 on 1.34-1.35 (where the feature gate and
  #    the API must be turned on).
  apiVersion: admissionregistration.k8s.io/v1
  # -- Each mutation's enabled (default from its definition) and settings, for example:
  #      add-default-security-context: { enabled: true }               # on by default
  #      disable-service-account-token-automount: { enabled: true }    # off by default
  #      add-default-resources: { enabled: true, cpuRequest: 100m, memoryRequest: 128Mi, memoryLimit: 128Mi }
  policies: {}

# -- Reporting on what the policies do.
reporting:
  # -- A Grafana dashboard built on the API server's admission-policy metrics (denials,
  #    warnings, audits, and errors per policy and binding; mutations), as a ConfigMap the
  #    Grafana sidecar (e.g. kube-prometheus-stack's) loads. Needs Prometheus scraping the API
  #    server. Only this release's enabled policies and mutations are shown.
  #    The ConfigMap is always in this release's namespace: this chart installs before
  #    anything else, so Grafana's namespace may not exist yet. Point Grafana's dashboard
  #    sidecar at it instead, e.g. kube-prometheus-stack's
  #    grafana.sidecar.dashboards.searchNamespace: ALL (or a list including this namespace).
  grafanaDashboard:
    enabled: false
    # -- Labels the Grafana sidecar selects dashboards by.
    labels:
      grafana_dashboard: "1"
    # -- Annotations, e.g. grafana_folder: Security.
    annotations: {}
