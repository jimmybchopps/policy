name: disable-service-account-token-automount
default: { enabled: false }
description: >-
  Sets automountServiceAccountToken false where a Pod leaves it unset, and removes the token
  volume (kube-api-access-*) and its mounts that the ServiceAccount admission plugin already
  added. A Pod that sets automountServiceAccountToken true keeps its token.
controls:
  nist: [AC-6]
variables:
  # The ServiceAccount plugin runs before mutating policies: unless the pod said true, it may
  # already have added the projected token volume and a mount in every container.
  - name: tokenVolumes
    expression: >-
      (!has(object.spec.automountServiceAccountToken) || !object.spec.automountServiceAccountToken) &&
      has(object.spec.volumes)
        ? object.spec.volumes.filter(v, v.name.startsWith('kube-api-access-') && has(v.projected))
        : []
  - name: initContainers
    expression: "has(object.spec.initContainers) ? object.spec.initContainers : []"
mutations:
  # Removed first, while the field is still unset. One volume, one mount per container.
  - patchType: JSONPatch
    expression: >-
      size(variables.tokenVolumes) == 0 ? [] :
      object.spec.containers
        .filter(c, has(c.volumeMounts) && c.volumeMounts.exists(m, m.name == variables.tokenVolumes[0].name))
        .map(c, JSONPatch{op: 'remove', path: '/spec/containers/' + string(object.spec.containers.indexOf(c)) +
          '/volumeMounts/' + string(c.volumeMounts.indexOf(
            c.volumeMounts.filter(m, m.name == variables.tokenVolumes[0].name)[0]))}) +
      variables.initContainers
        .filter(c, has(c.volumeMounts) && c.volumeMounts.exists(m, m.name == variables.tokenVolumes[0].name))
        .map(c, JSONPatch{op: 'remove', path: '/spec/initContainers/' + string(variables.initContainers.indexOf(c)) +
          '/volumeMounts/' + string(c.volumeMounts.indexOf(
            c.volumeMounts.filter(m, m.name == variables.tokenVolumes[0].name)[0]))}) +
      [JSONPatch{op: 'remove', path: '/spec/volumes/' + string(object.spec.volumes.indexOf(variables.tokenVolumes[0]))}]
  - patchType: ApplyConfiguration
    expression: >-
      !has(object.spec.automountServiceAccountToken)
        ? Object{spec: Object.spec{automountServiceAccountToken: false}}
        : Object{}
