  - it: disallow-ephemeral-containers renders a policy and one binding when enabled
    set:
      policies:
        disallow-ephemeral-containers: { enabled: true }
    asserts:
      - hasDocuments: { count: 94 }
      - containsDocument: { kind: ValidatingAdmissionPolicyBinding, apiVersion: admissionregistration.k8s.io/v1, name: disallow-ephemeral-containers, any: true }
      - containsDocument: { kind: ValidatingAdmissionPolicyBinding, apiVersion: admissionregistration.k8s.io/v1, name: disallow-ephemeral-containers-controllers, any: true }
        not: true

  - it: require-image-digest
    asserts:
      - containsDocument: { kind: ValidatingAdmissionPolicy, apiVersion: admissionregistration.k8s.io/v1, name: require-image-digest, any: true }
      - containsDocument: { kind: ValidatingAdmissionPolicyBinding, apiVersion: admissionregistration.k8s.io/v1, name: require-image-digest, any: true }
      - containsDocument: { kind: ValidatingAdmissionPolicyBinding, apiVersion: admissionregistration.k8s.io/v1, name: require-image-digest-controllers, any: true }

