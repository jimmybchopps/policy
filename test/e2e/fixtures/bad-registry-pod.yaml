# A Pod whose image comes from a registry no example allows. Used where a policy must not apply
# (kube-system), so its admission proves the exclusion rather than compliance.
apiVersion: v1
kind: Pod
metadata:
  name: bad-registry
  labels:
    app.kubernetes.io/name: bad-registry
spec:
  containers:
    - name: app
      image: docker.io/library/busybox:1.37
